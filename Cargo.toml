[package]
name = "po"
version = "0.3.0"
edition = "2024"
description = "A native desktop GUI for ACP coding agents: chat, file browser, code viewer and diffs."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sumofbytes/po"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11"] }
env_logger = "0.11"
log = "0.4"
libc = "0.2"
futures = "0.3"
serde_json = "1"
anyhow = "1"
notify = "8"
ignore = "0.4"
tree-sitter = "0.26"
streaming-iterator = "0.1"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
aho-corasick = "1"
markdown = "1"
# The viewer's grammars: the versions gpui-kit's `tree-sitter-languages` uses.
tree-sitter-astro-next = "0.1.1"
tree-sitter-bash = "0.23.3"
tree-sitter-c = "0.24.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cmake = "0.7.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.23.2"
tree-sitter-diff = "0.1.0"
tree-sitter-elixir = "0.3"
tree-sitter-embedded-template = "0.23.0"
tree-sitter-go = "0.23.4"
tree-sitter-graphql = "0.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-jsdoc = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.0"
tree-sitter-lua = "0.4.1"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.1"
tree-sitter-php = "0.24.2"
tree-sitter-proto = "0.2.0"
tree-sitter-python = "0.23.6"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-scala = "0.23.4"
tree-sitter-sequel = "0.3.8"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-swift = "0.7.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.1"
tree-sitter-zig = "1.1.2"
# TLS is only for `po update`: the daemon is plain HTTP to localhost.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[profile.dev]
debug = "line-tables-only"

# Tries Vulkan alone before probing GL/EGL, which costs ~75 ms at launch.
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
