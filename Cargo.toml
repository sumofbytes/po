[package]
name = "po"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.7.1", features = ["tree-sitter-languages"] }
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11"] }
env_logger = "0.11"
log = "0.4"
futures = "0.3"
serde_json = "1"
anyhow = "1"
notify = "8"

[profile.dev]
debug = "line-tables-only"
