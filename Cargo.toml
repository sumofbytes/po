[package]
name = "po"
version = "0.30.0"
edition = "2024"
description = "A native desktop GUI for ACP coding agents: chat, file browser, code viewer and diffs."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sumofbytes/po"

[dependencies]
# The UI: Rune. Pin a `dev` rev; `dev` is never rewritten.
rune = { features = ["native-file-dialog"], git = "https://github.com/anomalyco/rune", rev = "b3aab6ed31d0679b61b4910fa8b73daaf3e10277" }
rune-kit = { features = ["mermaid"], git = "https://github.com/anomalyco/rune", rev = "b3aab6ed31d0679b61b4910fa8b73daaf3e10277" }
env_logger = "0.11"
log = "0.4"
libc = "0.2"
futures = "0.3"
serde_json = "1"
anyhow = "1"
notify = "8"
ignore = "0.4"
# TLS is only for `po update`: the daemon is plain HTTP to localhost.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
base64 = "0.22"
# The issues store the window's NSH screen and the sidebar share.
tokio = { version = "1", default-features = false, features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# The terminal: libghostty-vt's emulator, built from source with Zig 0.15.2 (see mise.toml).
libghostty-vt = { version = "0.2.2", default-features = false }
# Profiling, off unless built with a `hotpath` feature below; see docs/profiling.md.
hotpath = { version = "0.30", default-features = false }

[features]
# `cargo run --features hotpath -- -f .` times the measured functions, channels and locks and
# reports when Po quits; `hotpath-alloc` also counts each function's allocations. Never default.
hotpath = ["hotpath/hotpath", "hotpath/threads", "hotpath/futures", "hotpath/tokio"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# wgpu-hal 30 needs gpu-allocator on windows 0.62, but crates.io's 0.28.0 pins windows 0.57, which
# breaks the DX12 build. Upstream main accepts 0.62 (still version 0.28.0), so build from it.
# Drop this once a gpu-allocator release supports windows 0.62.
[patch.crates-io]
gpu-allocator = { git = "https://github.com/Traverse-Research/gpu-allocator", rev = "5d8be6b0b68376d12c392a822fcee89ec22e995b" }

[profile.dev]
debug = "line-tables-only"
