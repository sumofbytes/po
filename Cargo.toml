[package]
name = "po"
version = "0.15.0"
edition = "2024"
description = "A native desktop GUI for ACP coding agents: chat, file browser, code viewer and diffs."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sumofbytes/po"

[dependencies]
gpui = { package = "gpui-fast", version = "=0.1.9", default-features = false, features = ["stacker", "font-kit", "wayland", "x11"] }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.9", default-features = false, features = ["font-kit", "wayland", "x11"] }
# NSH: screens drawn as NSH apps inside Po's window. Rust roots only, so no QuickJS or web views.
nsh-platform-gpui = { version = "0.3.0", default-features = false }
nsh-core = "0.3.0"
nsh-base = { version = "0.3.0" }
env_logger = "0.11"
log = "0.4"
libc = "0.2"
futures = "0.3"
serde_json = "1"
anyhow = "1"
notify = "8"
ignore = "0.4"
# TLS is only for `po update`: the daemon is plain HTTP to localhost.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
base64 = "0.22"
# The issues store the window's NSH screen and the sidebar share.
tokio = { version = "1", default-features = false, features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# The terminal: libghostty-vt's emulator, built from source with Zig 0.15.2 (see mise.toml).
libghostty-vt = { version = "0.2.2", default-features = false }

[dev-dependencies]
# Headless runs of the NSH screens.
nsh-engine = { version = "0.3.0", default-features = false }
nsh-testing = { version = "0.3.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.dev]
debug = "line-tables-only"

# Tries Vulkan alone before probing GL/EGL, which costs ~75 ms at launch. The apple copy carries
# zed #65571's blend fix (destination alpha was `One`, so a translucent fill over a translucent
# window background turned opaque — the glass look) ahead of a gpui-fast release with it.
[patch.crates-io]
gpui-fast-wgpu = { path = "vendor/gpui-fast-wgpu" }
gpui-fast-apple = { path = "vendor/gpui-fast-apple" }
gpui-fast-windows = { path = "vendor/gpui-fast-windows" }
# The green macOS traffic light zooms instead of entering native full screen
# (see `vendor/gpui-fast-macos/src/window.rs`, `MacWindow::open`).
gpui-fast-macos = { path = "vendor/gpui-fast-macos" }
