name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang mold pkg-config libwayland-dev libxkbcommon-x11-dev \
            libxkbcommon-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked
      - run: scripts/check-design.sh

  # Portability gate, same as dex: windows-latest has MSVC preinstalled.
  windows-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-check
      - run: cargo build --all-targets --locked
